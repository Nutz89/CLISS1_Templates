<!DOCTYPE html>

    <title>Exercise 3.7.1</title>
    <meta charset="UTF-8">

    <body>
        <h2>JS Fundamentals</h2>
        <script>
   let r=parseFloat(prompt("what is the radius of the circle in cm?"));
   let pi=Math.PI;
   let p=(Math.round((pi*r*r)*100))/100;
   let p1=(p +"cm")
   alert(p1);

        </script>
    </body>
