        <h2>JS Fundamentals</h2>
        <script>
   let si=parseFloat(prompt("what is the size of your file in MB?"));
   let sp=parseFloat(prompt("what is your download speed in MBit/s?"));
   let t=(si/(sp/8));
   let t1=("The remaining download time is "+ t +" seconds.")
   alert(t1);
        </script>
