<!DOCTYPE html>
<html lang=en>
    <head>
    <title>Exercise 3.7.1</title>
    <meta charset="UTF-8">
    </head>
    <body>
        <h2>JS Fundamentals</h2>
        <script>
   let n1=parseFloat(prompt("Enter number"));
   let n2=parseFloat(prompt("Enter number"));
   let n3=parseFloat(prompt("Enter number"));
   let s=(n1+n2+n3);
   let a=(Math.round(s/3));
   let mi=Math.min(n1,n2,n3)
   let ma=Math.max(n1,n2,n3)
   alert("Numbers given: [" +n1 + ", " + n2 + ", " + n3 + "]"+ "\n"
   + "The sum is: " +s +"\n"
   + "The average is: "+a +"\n"
   + "The minimum is: "+mi +"\n"
   + "The maximum is: "+ma);
        </script>
    </body>
</html>
