<!DOCTYPE html>
</html lang=en>
<head>
    <title>Exercise 4.3.2 Solution</title>
    <meta charset="UTF-8">
</head>
<body>
    <h2>Calculator</h2>
    <p id="calcText" ;></p>
    <img id="imageShape" width="200" height="200">
    <script>
        let shape = prompt("What is the shape you want to calculate the perimeter?")
        if (shape == "rectangle") {
            //write here your code for the rectangle
        let w=parseFloat(prompt("width?"));
        let h=parseFloat(prompt("height?"));
        let area=w*h;
        document.getElementById("calcText").innerHTML = "A = 2 * 1 + 2 * w" + "=" + area;
        document.getElementById("calcText").style.color="red";
        document.getElementById("ImageShape").src= "Pictures/Rectangle_Perimeter.png";
        }
        else if (shape == "circle") {
            //write here your code for the circle
        let r=parseFloat(prompt("radius?"));
        let pi=Math.PI;
        document.getElementById("calcText").innerHTML = "A = 2 * pi * r" + "=" + area;
        document.getElementById("calcText").style.color="blue";
        document.getElementById("ImageShape").src= "Pictures/Circle_Perimeter.png";
       }
        </script>
</body>
</html>
