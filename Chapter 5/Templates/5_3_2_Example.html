<!DOCTYPE html>
<html lang=en>
    <head>
        <title>
            Logical operators example
        </title>
        <meta charset="UTF-8">
    </head>
    
    <body>
        <script>
        "use strict";
        let input1 = parseInt(prompt("Number 1?"));
        let input2 = parseInt(prompt("Number 2?"));
        if (input1 == 50 || input2 == 50){
            document.write("condition fulfilled");
        } 
        else if (input1 + input2 == 50){
            document.write("condition fulfilled");
        } 
        else{
            document.write("condition not fulfilled"); 
        }
        </script>
    </body>
</html>
